[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "serialconsole"
version = "0.1.0"
description = "A simple interactive serial port console"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
serialconsole = "serialconsole.__main__:main"
